<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin demandes - Bouguenais Ludique</title>
    <meta name="description" content="Suivi des demandes de commande Bouguenais Ludique." />
    <link rel="icon" href="../assets/images/favicon_BL.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
      .admin-layout {
        display: grid;
        gap: 1.25rem;
      }
      .admin-card {
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 1rem;
        padding: 1rem;
        background: #fff;
      }
      .admin-table-wrap {
        overflow-x: auto;
      }
      .admin-table {
        width: 100%;
        border-collapse: collapse;
      }
      .admin-table th,
      .admin-table td {
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        padding: 0.6rem 0.4rem;
        text-align: left;
        vertical-align: top;
      }
      .admin-empty {
        color: rgba(30, 30, 30, 0.7);
      }
      .admin-media-link {
        color: #1e40af;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .admin-request-details {
        min-width: 220px;
      }
      .admin-request-notes {
        min-width: 220px;
      }
      .admin-request-notes textarea {
        width: 100%;
        min-height: 92px;
        resize: vertical;
      }
      .admin-request-status {
        min-width: 150px;
      }
    </style>
  </head>
  <body class="content-page">
    <header class="site-header">
      <div class="container">
        <a class="logo" href="../index.html">
          <span class="logo-mark" aria-hidden="true">🎲</span>
          <span class="logo-title">Bouguenais Ludique</span>
        </a>
        <nav class="main-nav">
          <a href="../index.html">Accueil</a>
          <a href="./catalogue.html">Commander</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <p class="eyebrow">Administration</p>
          <h1>Demandes de commande</h1>
          <p class="hero-text">
            Suis les demandes reçues, qualifie leur statut et conserve les notes de traitement.
          </p>
        </div>
      </section>

      <section class="section section-alt">
        <div class="container admin-layout">
          <p id="admin-status" class="form-feedback" role="status" aria-live="polite" hidden></p>
          <article class="admin-card" id="admin-requests-section" hidden>
            <h2>Suivi des demandes</h2>
            <p id="admin-requests-feedback" class="form-feedback" role="status" aria-live="polite" hidden></p>
            <div class="admin-table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Demandeur</th>
                    <th>Demande</th>
                    <th>Détails</th>
                    <th>Statut</th>
                    <th>Notes admin</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="admin-requests-body">
                  <tr>
                    <td colspan="7" class="admin-empty">Chargement des demandes…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 Bouguenais Ludique</p>
      </div>
    </footer>

    <script src="../assets/js/auth-config.js"></script>
    <script src="../assets/js/auth-api.js"></script>
    <script src="../assets/js/auth-ui.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/script.js"></script>
  </body>
</html>
