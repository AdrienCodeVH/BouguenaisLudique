<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin produits - Bouguenais Ludique</title>
    <meta name="description" content="Gestion des produits administrateur Bouguenais Ludique." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="icon" href="../assets/images/favicon_BL.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../assets/css/style.css?v=20260822-3" />
    <style>
      .admin-layout {
        display: grid;
        gap: 1.25rem;
      }
      .admin-card {
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 1rem;
        padding: 1rem;
        background: #fff;
      }
      .admin-form-inline {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: end;
      }
      .admin-form-inline .form-field {
        flex: 1 1 220px;
      }
      .admin-table-wrap {
        overflow-x: auto;
      }
      .admin-table {
        width: 100%;
        border-collapse: collapse;
      }
      .admin-table th,
      .admin-table td {
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        padding: 0.6rem 0.4rem;
        text-align: left;
        vertical-align: top;
      }
      .admin-empty {
        color: rgba(30, 30, 30, 0.7);
      }
      .admin-media-link {
        color: #1e40af;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
    </style>
  </head>
  <body class="content-page">
    <header class="site-header">
      <div class="container">
        <a class="logo" href="../index.html">
          <span class="logo-mark" aria-hidden="true">🎲</span>
          <span class="logo-title">Bouguenais Ludique</span>
        </a>
        <nav class="main-nav">
          <a href="../index.html">Accueil</a>
          <a href="./catalogue.html">Commander</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <p class="eyebrow">Administration</p>
          <h1>Produits</h1>
          <p class="hero-text">Ajout et suppression des produits catalogue.</p>
        </div>
      </section>

      <section class="section section-alt">
        <div class="container admin-layout">
          <p id="admin-status" class="form-feedback" role="status" aria-live="polite" hidden></p>
          <nav
            id="admin-services-nav"
            class="admin-card admin-services-nav"
            aria-label="Services principaux"
            hidden
          ></nav>
          <article class="admin-card" id="admin-products-section" hidden>
            <h2>Gestion des produits</h2>
            <form id="admin-product-form" class="admin-form-inline">
              <div class="form-field">
                <label for="product-name">Nom</label>
                <input id="product-name" name="name" type="text" maxlength="120" required />
              </div>
              <div class="form-field">
                <label for="product-category">Catégorie</label>
                <select id="product-category" name="category" required>
                  <option value="" selected disabled>Choisir une catégorie</option>
                </select>
              </div>
              <div class="form-field">
                <label for="product-price">Prix (EUR)</label>
                <input id="product-price" name="price_eur" type="number" min="0" step="0.01" required />
              </div>
              <div class="form-field">
                <label for="product-age-min">Âge minimum (optionnel)</label>
                <input id="product-age-min" name="age_min" type="number" min="0" step="1" />
              </div>
              <div class="form-field">
                <label for="product-age-max">Âge maximum (optionnel)</label>
                <input id="product-age-max" name="age_max" type="number" min="0" step="1" />
              </div>
              <div class="form-field">
                <label for="product-image-url">Photo (URL, optionnel)</label>
                <input
                  id="product-image-url"
                  name="image_url"
                  type="url"
                  maxlength="500"
                  placeholder="https://..."
                />
              </div>
              <div class="form-field">
                <label for="product-video-url">Vidéo règles/explication (URL, optionnel)</label>
                <input
                  id="product-video-url"
                  name="video_url"
                  type="url"
                  maxlength="500"
                  placeholder="https://..."
                />
              </div>
              <button type="submit" class="btn">Ajouter</button>
            </form>
            <p id="admin-products-feedback" class="form-feedback" role="status" aria-live="polite" hidden></p>
            <div class="admin-table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Produit</th>
                    <th>Catégorie</th>
                    <th>Prix</th>
                    <th>Âges</th>
                    <th>Médias</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="admin-products-body">
                  <tr>
                    <td colspan="6" class="admin-empty">Chargement des produits…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2026 Bouguenais Ludique</p>
        <nav class="footer-nav" aria-label="Informations légales">
          <a href="./mentions-legales.html">Mentions légales</a>
          <a href="./confidentialite.html">Confidentialité</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </div>
    </footer>

    <script src="../assets/js/auth-config.js?v=20260822-1"></script>
    <script src="../assets/js/auth-api.js?v=20260822-1"></script>
    <script src="../assets/js/auth-ui.js?v=20260822-1"></script>
    <script src="../assets/js/admin.js?v=20260822-4"></script>
    <script src="../assets/js/script.js?v=20260822-1"></script>
  </body>
</html>
