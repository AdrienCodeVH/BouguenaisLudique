<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Bouguenais Ludique</title>
    <meta
      name="description"
      content="Espace administrateur Bouguenais Ludique."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="icon" href="../assets/images/favicon_BL.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../assets/css/style.css?v=20260822-2" />
    <style>
      .admin-layout {
        display: grid;
        gap: 1.25rem;
      }
      .admin-card {
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 1rem;
        padding: 1rem;
        background: #fff;
      }
      .admin-form-inline {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: end;
      }
      .admin-form-inline .form-field {
        flex: 1 1 220px;
      }
      .admin-table-wrap {
        overflow-x: auto;
      }
      .admin-table {
        width: 100%;
        border-collapse: collapse;
      }
      .admin-table th,
      .admin-table td {
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        padding: 0.6rem 0.4rem;
        text-align: left;
        vertical-align: top;
      }
      .admin-empty {
        color: rgba(30, 30, 30, 0.7);
      }
      .admin-visibility-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .admin-visibility-card {
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 0.8rem;
        padding: 0.75rem;
        background: #fcfcfc;
      }
      .admin-visibility-card h4 {
        margin: 0 0 0.4rem;
        font-size: 0.92rem;
      }
      .admin-visibility-metric {
        margin: 0 0 0.45rem;
        font-weight: 700;
      }
      .admin-visibility-track {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .admin-visibility-fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #1e40af, #3b82f6, #eab308);
      }
    </style>
  </head>
  <body class="content-page">
    <header class="site-header">
      <div class="container">
        <a class="logo" href="../index.html">
          <span class="logo-mark" aria-hidden="true">🎲</span>
          <span class="logo-title">Bouguenais Ludique</span>
        </a>

        <nav class="main-nav">
          <a href="../index.html">Accueil</a>
          <a href="./catalogue.html">Commander</a>
          <a href="./contact.html">Contact</a>
          <a class="main-nav-btn main-nav-btn--ghost" href="./connexion.html">Connexion</a>
          <a class="main-nav-btn main-nav-btn--primary" href="./inscription.html">S'inscrire</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <p class="eyebrow">Administration</p>
          <h1>Espace admin</h1>
          <p class="hero-text">
            Gère les comptes, le baromètre et les produits depuis cette page.
          </p>
        </div>
      </section>

      <section class="section section-alt">
        <div class="container admin-layout">
          <p id="admin-status" class="form-feedback" role="status" aria-live="polite" hidden></p>

          <nav
            id="admin-services-nav"
            class="admin-card admin-services-nav"
            aria-label="Services principaux"
            hidden
          ></nav>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2026 Bouguenais Ludique</p>
        <nav class="footer-nav" aria-label="Informations légales">
          <a href="./mentions-legales.html">Mentions légales</a>
          <a href="./confidentialite.html">Confidentialité</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </div>
    </footer>

    <script src="../assets/js/auth-config.js?v=20260822-1"></script>
    <script src="../assets/js/auth-api.js?v=20260822-1"></script>
    <script src="../assets/js/auth-ui.js?v=20260822-1"></script>
    <script src="../assets/js/admin.js?v=20260822-3"></script>
    <script src="../assets/js/script.js?v=20260822-1"></script>
  </body>
</html>
